version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: jobtracker_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jobtracker
    volumes:
      - mongodb_data:/data/db
    networks:
      - jobtracker_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtracker_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/jobtracker
      PORT: 5000
      JWT_SECRET: your_jwt_secret_key_here
      NODE_ENV: production
    networks:
      - jobtracker_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtracker_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    networks:
      - jobtracker_network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  jobtracker_network:
    driver: bridge
